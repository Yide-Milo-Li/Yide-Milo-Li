# Regenerates the live README images (stats, languages, project cards, contribution snake)
# and publishes them to the `output` branch so `main` history stays clean.
name: Profile assets

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Render stats cards
        run: node scripts/build-assets.mjs stats --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0064a4&color_dots=#ebedf0,#c6dbef,#7fb2d9,#3a86c2,#0064a4
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffd200&color_dots=#161b22,#3d3415,#7a6516,#c9a10a,#ffd200

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
