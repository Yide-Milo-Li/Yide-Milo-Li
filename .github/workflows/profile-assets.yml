# Regenerates the live README images (stats, languages, project cards, Zot card, 3D graph, snake)
# and publishes them to the `output` branch so `main` history stays clean. The only commit to `main`
# is the project grid in README.md, and only when the star ranking changes its order.
name: Profile assets

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"
      - ".github/profile-3d-contrib.json"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Render stats cards and rank projects
        run: node scripts/build-assets.mjs stats --out dist --readme README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0064a4&color_dots=#ebedf0,#c6dbef,#7fb2d9,#3a86c2,#0064a4
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffd200&color_dots=#161b22,#3d3415,#7a6516,#c9a10a,#ffd200

      - name: Render 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-contrib.json

      - name: Collect 3D contribution graph
        run: cp profile-3d-contrib/contrib3d-light.svg profile-3d-contrib/contrib3d-dark.svg dist/

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs after publishing so every card the new order points at already exists.
      - name: Commit project order
        run: |
          if git diff --quiet -- README.md; then
            echo "Project order unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: reorder projects by stars" -- README.md
          git pull --rebase origin main
          git push origin HEAD:main
